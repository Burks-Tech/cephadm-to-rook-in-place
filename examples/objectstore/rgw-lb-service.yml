---
# The one client endpoint of the Rook RGW. Rook's own Service is headless (hostNetwork), so this Service selects the same pods.
#   in-cluster:  http://rook-ceph-rgw-s3-lb.rook-ceph.svc.cluster.local   (port 80, plain HTTP)
#   LAN:         https://s3.example.com -> the LB IP :443, RGW terminates TLS itself (no re-issuing proxy in the path;
#                a Go reverse proxy drops Content-Length: 0 on bodyless requests and breaks AWS CRT signatures)
#   off-site:    a tunnel/CDN whose origin is the in-cluster name on port 80 (Host header kept)
#   operator:    CephObjectStore hosting.advertiseEndpoint
# externalTrafficPolicy Cluster: the MetalLB speakers run on ordinary nodes only, not on the tainted storage nodes.
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-rgw-s3-lb
  namespace: rook-ceph
  annotations:
    metallb.io/loadBalancerIPs: 198.51.100.54
spec:
  type: LoadBalancer
  selector:
    app: rook-ceph-rgw
    rook_object_store: s3
  ports:
    - name: http
      port: 80
      targetPort: 8081                    # gateway.port
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8444                    # gateway.securePort
      protocol: TCP
